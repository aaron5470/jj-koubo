name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jj/assets/remotion-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jj/assets/remotion-template/package-lock.json
      - run: npm ci
      - run: npm run typecheck
